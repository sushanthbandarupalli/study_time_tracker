projects:
  - name: StudyTrack
    environments:
      - name: Production
        services:
          - type: web
            name: studytrack
            runtime: python
            plan: free
            rootDir: studytrack
            buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
            startCommand: gunicorn config.wsgi:application
            healthCheckPath: /health/
            envVars:
              - key: SECRET_KEY
                generateValue: true
              - key: DEBUG
                value: "False"
              - key: PYTHON_VERSION
                value: "3.13.4"
              - key: DATABASE_URL
                sync: false
              - key: SITE_DOMAIN
                sync: false
              - key: RESEND_API_KEY
                sync: false
              - key: DEFAULT_FROM_EMAIL
                sync: false
              - key: GOOGLE_OAUTH_CLIENT_ID
                sync: false
              - key: GOOGLE_OAUTH_CLIENT_SECRET
                sync: false
              - key: ALLOWED_HOSTS
                value: ".onrender.com"
              - key: CSRF_TRUSTED_ORIGINS
                value: "https://*.onrender.com"
